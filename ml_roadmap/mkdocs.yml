site_name: ML Mastery Roadmap
site_url: https://example.com/ml-roadmap/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home:
    - index.md
    - Features Demo: demo.md
  - Math Foundations:
    - math-foundations/index.md
    - Linear Algebra: math-foundations/linear-algebra.md
    - Calculus: math-foundations/calculus.md
    - Probability & Statistics: math-foundations/probability-statistics.md
  - Python ML:
    - python-ml/index.md
    - NumPy: python-ml/numpy.md
    - Pandas: python-ml/pandas.md
    - Visualization: python-ml/visualization.md
    - Scikit-learn: python-ml/scikit-learn.md
  - Core ML:
    - core-ml/index.md
    - Supervised Learning: core-ml/supervised-learning.md
    - Unsupervised Learning: core-ml/unsupervised-learning.md
    - Model Evaluation: core-ml/model-evaluation.md
    - Feature Engineering: core-ml/feature-engineering.md
  - Deep Learning:
    - deep-learning/index.md
    - Neural Network Fundamentals: deep-learning/neural-network-fundamentals.md
    - CNNs: deep-learning/cnns.md
    - RNNs & Sequence Models: deep-learning/rnns-sequence-models.md
    - Transformers & Attention: deep-learning/transformers-attention.md
    - Frameworks: deep-learning/frameworks.md
  - MLOps:
    - mlops/index.md
    - Project Lifecycle: mlops/project-lifecycle.md
    - Model Deployment: mlops/model-deployment.md
    - Monitoring & Maintenance: mlops/monitoring-maintenance.md
    - System Design: mlops/system-design.md
  - Research Skills:
    - research-skills/index.md
    - Reading Papers: research-skills/reading-papers.md
    - Reproducing Results: research-skills/reproducing-results.md
    - Staying Current: research-skills/staying-current.md
